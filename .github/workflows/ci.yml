name: CI

# The graph and the status page describe the whole organisation, so they go
# stale whenever any other repository changes or releases. This workflow
# therefore rebuilds them every six hours as well as on every push, and deploys
# what it built. Nothing it generates is committed: every run reads the
# repositories afresh, pull requests included, so that a change to the scripts
# is built from the same data as a deploy.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read by the status page, which reports what is open and whether checks pass.
      issues: read
      pull-requests: read
      checks: read
      statuses: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run lint:types

      - name: Test
        run: npm run test

      # Files and listings under their git hashes, so that a run fetches only what
      # changed since the last one. Nothing in it can go stale, so the newest
      # entry is always the right one to start from. A cache entry can't be
      # overwritten, so each run saves its own, and only when the job succeeds.
      - name: Restore the files read by earlier runs
        uses: actions/cache@v6
        with:
          path: .cache/github
          key: github-objects-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: github-objects-

      - name: Rebuild the dependency graph
        run: npm run sync:deps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build

      - name: Add .nojekyll
        run: touch ./.vitepress/dist/.nojekyll

      - name: Upload Pages Artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./.vitepress/dist

  deploy:
    name: Deploy
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
