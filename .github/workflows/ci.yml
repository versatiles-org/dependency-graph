name: CI

# The graph and the status page describe the whole organisation, so they go
# stale whenever any other repository changes or releases. This workflow
# therefore rebuilds them every six hours as well as on every push, and deploys
# in the same run: a push made with GITHUB_TOKEN starts no workflow, so a later
# run could not publish the result. The status snapshot is not committed, so
# every run deploys, even when the graph itself has not changed.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Read by the status page, which reports what is open and whether checks pass.
      issues: read
      pull-requests: read
      checks: read
      statuses: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run lint:types

      - name: Test
        run: npm run test

      - name: Rebuild the dependency graph
        if: github.event_name != 'pull_request'
        run: npm run sync:deps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A generated page can break the site, so build before committing.
      - name: Build
        run: npm run build

      - name: Commit and push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          if [ -z "$(git status --porcelain index.md public/dependency-graph.json)" ]; then
            echo "no changes"
            exit 0
          fi
          git add index.md public/dependency-graph.json
          git commit -m 'update repository dependency graph'
          git push
        shell: bash

      - name: Add .nojekyll
        run: touch ./.vitepress/dist/.nojekyll

      - name: Upload Pages Artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./.vitepress/dist

  deploy:
    name: Deploy
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
