name: CI

# The graph describes the whole organisation, so it goes stale whenever any
# other repository changes. This workflow therefore rebuilds it once a day as
# well as on every push, and deploys in the same run: a push made with
# GITHUB_TOKEN starts no workflow, so a later run could not publish the result.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run lint:types

      - name: Test
        run: npm run test

      - name: Rebuild the dependency graph
        if: github.event_name != 'pull_request'
        run: npm run sync:deps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A generated page can break the site, so build before committing.
      - name: Build
        run: npm run build

      - name: Commit and push
        id: commit
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          if [ -z "$(git status --porcelain index.md public/dependency-graph.json)" ]; then
            echo "no changes"
            echo "changed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git add index.md public/dependency-graph.json
          git commit -m 'update repository dependency graph'
          git push
          echo "changed=true" >>"$GITHUB_OUTPUT"
        shell: bash

      - name: Add .nojekyll
        run: touch ./.vitepress/dist/.nojekyll

      - name: Upload Pages Artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./.vitepress/dist

  deploy:
    name: Deploy
    needs: [build]
    # A daily run without new data has nothing to publish.
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      (github.event_name != 'schedule' || needs.build.outputs.changed == 'true')

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
